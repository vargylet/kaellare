name: Build and publish UNSTABLE docker container

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - .gitignore
      - .github/workflows/**
  workflow_dispatch:

# A newer push cancels a running build, so an older image can't end up as latest
concurrency:
  group: build-docker-dev
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}-dev:latest
          # Links the package to this repository on ghcr.io
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
