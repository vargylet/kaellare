name: Build and publish STABLE docker container

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # fetch all tags so we can compare versions

      # Only the highest version gets the latest tag, so a hotfix for an
      # older version (e.g. v1.0.5 after v1.1.0) doesn't move latest back
      - name: Check if this is the newest version
        id: version
        run: |
          newest=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n 1)
          echo "Pushed: $GITHUB_REF_NAME, newest: $newest"
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # github.ref_name is the pushed tag, e.g. v1.2.3. When it isn't the
          # newest version the second line is empty, which build-push-action ignores
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ${{ steps.version.outputs.latest == 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          # Links the package to this repository on ghcr.io
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
